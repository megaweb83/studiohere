<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060608">
<title>문의가 접수되었습니다 | 스튜디오 히어</title>
<link rel="icon" type="image/png" href="assets/img/logo-icon.png">
<link rel="apple-touch-icon" href="assets/img/logo-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<style>
  .thanks{
    min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:72px var(--pad) 56px;text-align:center;background:var(--ink);position:relative;overflow:hidden;
  }
  .thanks::before{
    content:"";position:absolute;left:50%;top:38%;width:min(720px,92vw);height:min(720px,92vw);
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,230,0,.10),transparent 66%);filter:blur(40px);
  }
  .thanks-card{position:relative;max-width:600px}
  .thanks-card img{width:clamp(120px,20vw,168px);height:auto;margin:0 auto 34px;display:block}
  .thanks-card h1{
    font-size:clamp(24px,3.4vw,34px);font-weight:600;letter-spacing:-.035em;line-height:1.3;
    color:var(--ivory);margin-bottom:16px;
  }
  .thanks-card h1 em{color:var(--accent-2)}
  .thanks-card p{font-size:13.5px;line-height:1.9;color:var(--muted-d);letter-spacing:-.01em}
  .thanks-card p a{color:var(--ivory);border-bottom:1px solid var(--accent-line);padding-bottom:1px}
  .thanks-card .rule{width:44px;height:1px;background:var(--accent);margin:28px auto}
  .thanks-card .btn{margin-top:6px}
  .thanks-mail{font-family:var(--sans);font-size:10px;letter-spacing:.22em;color:var(--muted-d2);margin-top:36px}
  .thanks-back{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-d);border-bottom:1px solid transparent;transition:.3s}
  .thanks-back:hover{color:var(--ivory);border-color:var(--accent)}
</style>
</head>
<body>
  <main class="thanks">
    <div class="thanks-card">
      <img src="assets/img/logo-transparent.png" alt="스튜디오 히어" width="246" height="231">
      <h1>문의가 <em>접수</em>되었습니다</h1>
      <p>보내주신 내용을 확인하고 <b>영업일 24시간 안에</b> 회신드리겠습니다.<br>
      급한 건은 <a href="mailto:djseo2707@gmail.com">djseo2707@gmail.com</a> 로 바로 보내주셔도 됩니다.</p>
      <div class="rule" aria-hidden="true"></div>
      <a class="btn btn-primary" href="index.html">사이트로 돌아가기</a>
      <div class="thanks-mail">STUDIO HERE — SEOUL</div>
    </div>
  </main>
</body>
</html>
